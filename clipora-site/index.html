<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipora - Video & Photo Editor</title>
  <style>
    :root {
      --bg: #0f111a;
      --card: #181b29;
      --text: #e6e8f0;
      --text-muted: #9aa1b9;
      --primary: #ff4f8b;
      --primary-gradient: linear-gradient(135deg, #ff4f8b, #ff7b54);
      --border: #292e42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .logo {
      width: 96px;
      height: 96px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(255, 79, 139, 0.3);
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 28px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
    }
    .btn-secondary {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Clipora</h1>
    <p>Free On-Device Video & Photo Editor for Android and iOS</p>
    <div class="links">
      <a class="btn btn-secondary" href="privacy.html">Privacy Policy / Gizlilik Politikası</a>
      <a class="btn btn-secondary" href="terms.html">Terms of Service / Kullanım Koşulları</a>
    </div>
  </div>
</body>
</html>
