<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zoomy Karts — cute animal kart racing</title>
<meta name="description" content="Drift, boost and zoom! Cute animal kart racing with wacky items and 24 tracks. Free on Android, iPhone and iPad.">
<meta property="og:title" content="Zoomy Karts 🏁 cute animal kart racing">
<meta property="og:description" content="30 adorable racers, 24 twisty tracks and the wackiest items. Can you beat my time?">
<meta property="og:image" content="https://memoli17.github.io/zoomy-karts/og.jpg">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="500">
<meta property="og:url" content="https://memoli17.github.io/zoomy-karts/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:linear-gradient(#6a5cff,#9b7bff 45%,#ff8fc8); color:#fff;
         font:17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align:center; }
  .card { background:#fff; color:#2a2240; border-radius:26px; padding:22px 20px 18px; max-width:460px; width:100%; box-shadow:0 8px 0 rgba(42,34,64,.35); }
  img.hero { width:100%; border-radius:16px; display:block; }
  h1 { margin:14px 0 4px; font-size:28px; }
  p { margin:6px 0 14px; }
  .btn { display:block; margin:10px 0; padding:14px 16px; border-radius:16px; font-weight:800; text-decoration:none; color:#fff; font-size:18px; }
  .play { background:#3fd47a; box-shadow:0 5px 0 #23944f; }
  .ios { background:#3d8bff; box-shadow:0 5px 0 #2459b0; }
  .soon { background:#a9a3c7; box-shadow:none; }
  small a { color:#8b5cff; }
</style>
</head>
<body>
  <div class="card">
    <img class="hero" src="og.jpg" alt="Zoomy Karts">
    <h1>Zoomy Karts 🏁</h1>
    <p id="tag">Drift, boost and zoom! Cute animal kart racing with wacky items and 24 tracks.</p>
    <a class="btn play" id="play" href="#">Get it on Google Play</a>
    <a class="btn ios" id="ios" href="#">Download on the App Store</a>
    <small><a href="privacy.html" id="priv">Privacy policy</a> · Mozi Tech Studios</small>
  </div>
<script>
  // After the iPhone version is live, put its App Store number here (App Store Connect → App Information → Apple ID).
  var APPLE_ID = '';
  var PKG = 'com.mozitechstudios.zoomykarts';
  var play = 'https://play.google.com/store/apps/details?id=' + PKG;
  var ios = APPLE_ID ? 'https://apps.apple.com/app/id' + APPLE_ID : '';
  var tr = (navigator.language || '').toLowerCase().indexOf('tr') === 0;
  if (tr) {
    document.documentElement.lang = 'tr';
    document.getElementById('tag').textContent = 'Drift at, turbola, uç! Çılgın eşyalı, 24 pistli sevimli hayvan kart yarışı.';
    document.getElementById('play').textContent = "Google Play'den indir";
    document.getElementById('ios').textContent = "App Store'dan indir";
    document.getElementById('priv').textContent = 'Gizlilik politikası';
  }
  document.getElementById('play').href = play;
  var iosBtn = document.getElementById('ios');
  if (ios) { iosBtn.href = ios; } else { iosBtn.className = 'btn soon'; iosBtn.removeAttribute('href'); iosBtn.textContent = tr ? 'iPhone: çok yakında' : 'iPhone: coming soon'; }
  var ua = navigator.userAgent || '';
  if (/android/i.test(ua)) { setTimeout(function () { location.href = play; }, 900); }
  else if (/iphone|ipad|ipod/i.test(ua) && ios) { setTimeout(function () { location.href = ios; }, 900); }
</script>
</body>
</html>
